<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyUnram Tracker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- Link to the main style for navbar, bg-glow, glass-card, etc. -->
    <link rel="stylesheet" href="../../assets/css/style.css">

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        outfit: ['Outfit', 'sans-serif']
                    },
                    colors: {
                        glass: {
                            100: 'rgba(255,255,255,0.05)',
                            200: 'rgba(255,255,255,0.1)'
                        },
                        accent: '#6366f1'
                    }
                }
            }
        }
    </script>

    <style>
        /* CSS untuk Transisi Modal */
        .modal-overlay {
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease-in-out;
        }

        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            transform: scale(0.95);
            transition: transform 0.3s ease-in-out;
        }

        .modal-overlay.show .modal-content {
            transform: scale(1);
        }

        /* Style untuk List Absen di dalam Modal */
        #existingAbsenInfo ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #existingAbsenInfo li {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
        }

        #existingAbsenInfo li:last-child {
            border-bottom: none;
        }

        #existingAbsenInfo li span.time {
            font-weight: 600;
            color: #818cf8;
        }

        .empty-data {
            color: #a0a0ab;
            font-style: italic;
            text-align: center;
        }

        /* Dark Theme FullCalendar */
        .fc {
            color: #ffffff !important;
        }

        .fc-theme-standard td,
        .fc-theme-standard th,
        .fc-theme-standard .fc-scrollgrid {
            border-color: rgba(255, 255, 255, 0.1) !important;
        }

        .fc-toolbar-title {
            font-size: 1.25rem !important;
            font-weight: 600 !important;
            font-family: 'Outfit', sans-serif;
        }

        .fc-button {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: #fff !important;
            backdrop-filter: blur(10px);
            padding: 0.4rem 0.8rem !important;
            text-transform: capitalize;
            transition: all 0.3s ease;
        }

        .fc-button:hover {
            background: rgba(255, 255, 255, 0.1) !important;
            transform: translateY(-2px);
        }

        .fc-button-active {
            background: rgba(99, 102, 241, 0.5) !important;
            border-color: #6366f1 !important;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.4) !important;
        }

        .fc-day-today {
            background-color: rgba(99, 102, 241, 0.15) !important;
        }

        .fc-list-day-cushion {
            background-color: rgba(255, 255, 255, 0.05) !important;
        }

        .fc-list-event:hover td {
            background-color: rgba(255, 255, 255, 0.1) !important;
        }

        .fc-popover {
            background: #12121a !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: #fff;
        }

        .fc-popover-header {
            background: rgba(255, 255, 255, 0.05) !important;
            color: #fff;
        }

        /* Inputs styling in glass theme */
        .glass-input {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }

        .glass-input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.3);
        }

        .glass-input option {
            background-color: #12121a;
            color: white;
        }

        @media (max-width: 768px) {
            .fc-toolbar-title {
                font-size: 1rem !important;
            }

            .fc-button {
                padding: 0.2rem 0.4rem !important;
                font-size: 0.8rem !important;
            }

            /* Sembunyikan the glow on mobile to improve performance if necessary */
            .bg-glow,
            .bg-glow-2 {
                opacity: 0.5;
            }
        }
    </style>
</head>

<body class="selection:bg-accent/30" style="color-scheme: dark;">

    <!-- Ambient Background -->
    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>

    <nav class="glass-nav fade-in-up mt-5">
        <div class="nav-container">
            <a href="../../index.html" class="logo">
                <div class="logo-dot"></div>
                NaufalRizqullah
            </a>
            <div class="nav-links">
                <a href="../../index.html" class="nav-link">Home</a>
                <a href="../contributing/index.html" class="nav-link">Contributing</a>
            </div>
        </div>
    </nav>

    <div class="container fade-in-up delay-1 mb-12">
        <h1 class="text-3xl md:text-4xl font-bold text-center text-white tracking-tight mb-8 font-outfit">
            MyUnram <span class="text-accent">Attendance</span> Tracker
        </h1>

        <div class="flex flex-col lg:flex-row gap-6 items-start">

            <div class="w-full lg:w-80 flex-shrink-0 glass-card !p-6">
                <h3 class="text-lg font-semibold text-white mb-4 pb-3 border-b border-white/10 font-outfit">
                    Pilih Pengguna
                </h3>

                <div class="flex flex-col gap-4">
                    <div class="relative">
                        <select id="username" class="w-full glass-input text-sm rounded-lg block p-3 transition-colors">
                            <option value="199911172025211028">M. Naufal Rizqullah</option>
                            <option value="196112311988031008">Amin</option>
                        </select>
                    </div>

                    <button onclick="searchUser()" class="btn btn-primary w-full py-3">
                        Tampilkan Data
                    </button>
                </div>
            </div>

            <div class="flex-1 w-full glass-card !p-6 min-h-[500px]">

                <div id="userInfo" style="display:none;"
                    class="bg-accent/10 border border-accent/20 rounded-xl p-5 mb-6 backdrop-blur-md">
                    <h3 id="namaStaff" class="text-xl font-bold text-white mb-2 font-outfit"></h3>
                    <div class="flex flex-col sm:flex-row sm:gap-6 text-sm text-gray-300">
                        <p>Username: <span id="usernameStaff" class="font-medium text-white"></span></p>
                        <p>Instansi: <span id="instansiStaff" class="font-medium text-white"></span></p>
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-3">
                    <h3 class="text-xl font-bold text-white hidden sm:block font-outfit">Kalender Absensi</h3>

                    <button onclick="openModalManual()" class="w-full sm:w-auto btn btn-glass text-sm px-4 py-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="mr-2">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                            <line x1="12" y1="15" x2="12" y2="15"></line>
                        </svg>
                        Absen / Tambah Data
                    </button>
                </div>

                <div class="overflow-x-auto">
                    <div id='calendar' class="min-w-[300px]"></div>
                </div>
            </div>

        </div>
    </div>

    <!-- Modal in glassmorphism style -->
    <div id="absenModal"
        class="modal-overlay fixed inset-0 z-40 flex items-start justify-center bg-black/70 backdrop-blur-md p-4 pt-28 pb-6 overflow-hidden">

        <div class="modal-content glass-card w-full max-w-3xl max-h-full !p-0 relative flex flex-col overflow-hidden">

            <div class="px-6 py-5 border-b border-white/10 flex justify-between items-center shrink-0 bg-white/5">
                <h3 class="text-lg font-bold text-white font-outfit">Detail Absensi</h3>
                <button onclick="closeModal()"
                    class="text-gray-400 hover:text-red-400 transition-colors text-2xl leading-none">&times;</button>
            </div>

            <div class="p-6 overflow-y-auto">
                <div class="mb-5">
                    <label class="block mb-2 text-sm font-medium text-gray-300">Tanggal:</label>
                    <input type="date" id="modalDateInput" class="glass-input text-sm rounded-lg block w-full p-2.5"
                        required>
                </div>

                <div id="existingAbsenInfo" class="bg-black/30 rounded-xl border border-white/10 p-5 mb-6 text-sm">
                </div>

                <div class="flex flex-col md:flex-row gap-6">
                    <div class="flex-1">
                        <form id="absenForm" onsubmit="submitManualAbsen(event)" class="flex flex-col gap-4 h-full">
                            <div>
                                <label for="absenType" class="block mb-2 text-sm font-medium text-gray-300">Tipe Absen Baru:</label>
                                <select id="absenType" class="glass-input text-sm rounded-lg block w-full p-2.5">
                                    <option value="mulai">Masuk (07:01 - 07:15)</option>
                                    <option value="istirahat_mulai">Istirahat Keluar (12:00 - 12:15)</option>
                                    <option value="istirahat_selesai">Istirahat Masuk (13:00 - 13:15)</option>
                                    <option value="selesai">Pulang (16:00 - 16:30)</option>
                                    <option value="mulai_dosen">Waktu Dosen (08:00 - 12:00)</option>
                                </select>
                            </div>
                            
                            <div class="mt-auto pt-2">
                                <button type="submit"
                                    class="w-full text-white bg-emerald-600 hover:bg-emerald-500 font-medium rounded-lg text-sm px-5 py-3 text-center transition-all shadow-[0_0_15px_rgba(5,150,105,0.4)] hover:shadow-[0_0_25px_rgba(5,150,105,0.6)]">
                                    Simpan Absen (Random Time)
                                </button>
                            </div>
                        </form>
                    </div>

                    <div class="md:hidden relative flex items-center py-2">
                        <div class="flex-grow border-t border-white/10"></div>
                        <span class="flex-shrink-0 mx-4 text-gray-400 text-xs font-medium uppercase tracking-wider">Atau</span>
                        <div class="flex-grow border-t border-white/10"></div>
                    </div>
                    
                    <div class="hidden md:flex flex-col items-center justify-center relative w-10 shrink-0">
                        <div class="h-full border-l border-white/10"></div>
                        <span class="absolute bg-[#12121a] py-2 text-gray-400 text-xs font-medium uppercase tracking-wider">Atau</span>
                    </div>

                    <div class="flex-1">
                        <form id="pulangForm" onsubmit="submitPulangOtomatis(event)"
                            class="flex flex-col gap-4 bg-indigo-900/20 p-5 rounded-xl border border-indigo-500/20 h-full">
                            <div>
                                <label for="lamaKerja" class="block mb-2 text-sm font-semibold text-accent"
                                    style="color: #818cf8;">Generate Pulang Otomatis</label>
                                <select id="lamaKerja" class="glass-input text-sm rounded-lg block w-full p-2.5">
                                    <option value="8">8 Jam</option>
                                    <option value="8.5">8.5 Jam</option>
                                </select>
                            </div>
                            <p class="text-xs text-gray-400 leading-relaxed">
                                Waktu pulang dihitung dari <strong class="text-gray-200">Jam Masuk</strong> yang tercatat +
                                <strong class="text-gray-200">Total Jam Kerja</strong> + <strong class="text-gray-200">Kompensasi Jeda (1 Jam)</strong> + <strong class="text-gray-200">(1-30 menit acak)</strong>.
                            </p>
                            
                            <div class="mt-auto pt-2">
                                <button type="submit"
                                    class="w-full btn btn-primary flex items-center justify-center gap-2 py-3 text-sm">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M12 2v20"></path>
                                        <path d="m17 5-5-3-5 3"></path>
                                        <path d="m19 19-7 3-7-3"></path>
                                        <path d="M2 12h20"></path>
                                    </svg>
                                    Generate Pulang
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <custom-footer></custom-footer>

    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js'></script>
    <script src="../../assets/js/components/footer.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script src="app.js"></script>

</body>

</html>
